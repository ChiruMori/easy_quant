server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }
  location / { try_files $uri $uri/ /index.html; }
}
