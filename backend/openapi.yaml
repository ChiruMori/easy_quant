{
  "openapi": "3.1.0",
  "info": {"title": "Easy Quant API", "version": "0.1.0"},
  "servers": [{"url": "/api/v1"}],
  "components": {
    "schemas": {
      "Success": {"type": "object", "required": ["data"], "properties": {"data": {}}},
      "Error": {"type": "object", "required": ["error", "request_id"], "properties": {"error": {"type": "object"}, "request_id": {"type": ["string", "null"]}}}
    },
    "securitySchemes": {"cookieSession": {"type": "apiKey", "in": "cookie", "name": "session"}, "csrf": {"type": "apiKey", "in": "header", "name": "X-CSRF-Token"}}
  },
  "paths": {
    "/chart-comparisons/instruments": {"get": {"operationId": "searchComparisonInstruments", "description": "登录用户按代码/名称搜索已有股票与指数，最多20条，不访问外部网络", "parameters": [{"name": "search", "in": "query", "schema": {"type": "string"}}], "responses": {"200": {"description": "读取成功，不修改回测和实盘状态"}, "400": {"description": "请求不明确或数据缺失"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "缺少可比配置或行情"}}}},
    "/chart-comparisons/backtest/{identifier}/candidates": {"get": {"operationId": "listComparableBacktests", "description": "本人相同起止日期、初始资金及持仓的已完成回测，最多20条", "parameters": [{"name": "identifier", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "search", "in": "query", "schema": {"type": "string"}}], "responses": {"200": {"description": "读取成功，不修改回测和实盘状态"}, "400": {"description": "请求不明确或数据缺失"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "缺少可比配置或行情"}}}},
    "/chart-comparisons/{kind}/{identifier}/series": {"get": {"operationId": "getTemporaryComparisonSeries", "description": "只读临时比较曲线；symbol/backtest_id 必须且仅有一个。回测金额为权益，实盘金额为收益；日线按可获知时间过滤，以区间起点可见收盘归一，后续无新报价时延用最近已发布价格。实盘不能添加回测。返回id/name/points(day,amount,return_rate)。", "parameters": [{"name": "kind", "in": "path", "required": true, "schema": {"enum": ["backtest", "live"]}}, {"name": "identifier", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "symbol", "in": "query", "schema": {"type": "string"}}, {"name": "backtest_id", "in": "query", "schema": {"type": "string"}}], "responses": {"200": {"description": "读取成功，不修改回测和实盘状态"}, "400": {"description": "请求不明确或数据缺失"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "缺少可比配置或行情"}}}},
    "/live-instances/{instance_id}/operations": {"get": {"operationId": "listLiveOperations", "description": "按日期与ID倒序分页；search 仅搜索标的、日期和说明；status 与 operation_type 独立组合筛选；已操作包含确认、修正及手动操作。", "parameters": [{"name": "instance_id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1}}, {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100}}, {"name": "search", "in": "query", "schema": {"type": "string"}}, {"name": "status", "in": "query", "schema": {"enum": ["pending", "executed", "rejected"]}}, {"name": "operation_type", "in": "query", "schema": {"enum": ["buy_signal", "sell_signal", "manual_buy", "manual_sell"]}}], "responses": {"200": {"description": "分页操作列表"}, "404": {"description": "不存在或无权限"}, "422": {"description": "分页参数无效"}}}},
    "/live-instances/{instance_id}/manual-operations/{mode}": {"post": {"operationId": "manualLiveOperation", "description": "preview 只校验并返回 required_increase 与 capital_pool；record 要求 risk_acknowledged=true 且 confirmed_increase 与最新所需金额一致；事务内注资与记账，按用户隔离幂等键。数量为正整百，不得占用待操作建议的预留。", "parameters": [{"name": "instance_id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "mode", "in": "path", "required": true, "schema": {"enum": ["preview", "record"]}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["idempotency_key", "symbol", "action", "quantity", "price"], "properties": {"idempotency_key": {"type": "string", "minLength": 8, "maxLength": 80}, "symbol": {"type": "string"}, "action": {"enum": ["buy", "sell"]}, "quantity": {"type": "string"}, "price": {"type": "string"}, "fee": {"type": "string"}, "risk_acknowledged": {"type": "boolean"}, "confirmed_increase": {"type": "string"}}}}}}, "responses": {"200": {"description": "预检或记账成功"}, "404": {"description": "不存在或无权限"}, "409": {"description": "资金/持仓/确认/幂等冲突"}, "422": {"description": "成交字段无效"}}}},
    "/strategies/workspace": {"get": {"operationId": "listStrategyWorkspace", "description": "按策略版本搜索、状态筛选和分页，不返回源码", "responses": {"200": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}}},
    "/strategies/{strategy_id}/versions/{version_id}": {"get": {"operationId": "getStrategyVersion", "description": "查看指定策略版本及状态、修订号与关联实盘", "responses": {"200": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}}, "put": {"operationId": "saveStrategyDraft", "description": "仅草稿可原地保存；expected_revision 必须匹配", "responses": {"200": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name", "source_code", "expected_revision"], "properties": {"confirmed": {"const": true}, "name": {"type": "string"}, "description": {"type": "string"}, "source_code": {"type": "string", "maxLength": 100000}, "expected_revision": {"type": "integer", "minimum": 0}, "trading_day": {"type": "string", "format": "date"}, "strategy_id": {"type": "string"}, "strategy_version_id": {"type": "string"}, "allow_mock": {"type": "boolean"}}}}}}}, "delete": {"operationId": "deleteStrategyVersion", "description": "二次确认后业务级联删除该版本及关联测试", "responses": {"200": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["confirmed"], "properties": {"confirmed": {"const": true}, "name": {"type": "string"}, "description": {"type": "string"}, "source_code": {"type": "string", "maxLength": 100000}, "expected_revision": {"type": "integer", "minimum": 0}, "trading_day": {"type": "string", "format": "date"}, "strategy_id": {"type": "string"}, "strategy_version_id": {"type": "string"}, "allow_mock": {"type": "boolean"}}}}}}}},
    "/strategies/{strategy_id}/versions/{version_id}/fork": {"post": {"operationId": "forkStrategyDraft", "description": "confirmed=true 后从指定版本创建新草稿，原版本不变", "responses": {"201": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["confirmed"], "properties": {"confirmed": {"const": true}, "name": {"type": "string"}, "description": {"type": "string"}, "source_code": {"type": "string", "maxLength": 100000}, "expected_revision": {"type": "integer", "minimum": 0}, "trading_day": {"type": "string", "format": "date"}, "strategy_id": {"type": "string"}, "strategy_version_id": {"type": "string"}, "allow_mock": {"type": "boolean"}}}}}}}},
    "/strategies/{strategy_id}/versions/{version_id}/deletion-preview": {"get": {"operationId": "previewDeleteStrategyVersion", "description": "检查该版本关联实盘、任务及测试数据", "responses": {"200": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}}},
    "/strategies/quick-test": {"post": {"operationId": "quickTestEditor", "description": "运行当前编辑器源码；不保存版本或历史代码快照，不改变状态；任务结束清除临时代码", "responses": {"202": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["source_code", "trading_day"], "properties": {"confirmed": {"const": true}, "name": {"type": "string"}, "description": {"type": "string"}, "source_code": {"type": "string", "maxLength": 100000}, "expected_revision": {"type": "integer", "minimum": 0}, "trading_day": {"type": "string", "format": "date"}, "strategy_id": {"type": "string"}, "strategy_version_id": {"type": "string"}, "allow_mock": {"type": "boolean"}}}}}}}},
    "/strategies/quick-tests/{job_id}": {"get": {"operationId": "getQuickTestResult", "description": "查询本人快测任务，不返回代码快照", "responses": {"200": {"description": "操作成功"}, "404": {"description": "资源不存在或无权限"}, "409": {"description": "状态、关联、修订号或二次确认冲突"}, "422": {"description": "参数无效"}}}},
    "/strategies/{strategy_id}/deletion-preview": {"get": {"operationId": "previewDeleteStrategy", "summary": "策略删除预检", "parameters": [{"name": "strategy_id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "删除预检影响范围，或删除成功"}, "401": {"description": "未登录"}, "404": {"description": "不存在或无权限"}, "409": {"description": "存在关联实盘、状态不允许、执行中任务或未二次确认"}}}},
    "/strategies/{strategy_id}": {"delete": {"operationId": "deleteStrategy", "summary": "二次确认后删除策略", "parameters": [{"name": "strategy_id", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["confirmed"], "properties": {"confirmed": {"const": true}}}}}}, "responses": {"200": {"description": "删除预检影响范围，或删除成功"}, "401": {"description": "未登录"}, "404": {"description": "不存在或无权限"}, "409": {"description": "存在关联实盘、状态不允许、执行中任务或未二次确认"}}}},
    "/live-instances/{instance_id}/deletion-preview": {"get": {"operationId": "previewDeleteLiveInstance", "summary": "实盘删除预检", "parameters": [{"name": "instance_id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "删除预检影响范围，或删除成功"}, "401": {"description": "未登录"}, "404": {"description": "不存在或无权限"}, "409": {"description": "存在关联实盘、状态不允许、执行中任务或未二次确认"}}}},
    "/notifications/subscriptions/{subscription_id}/deletion-preview": {"get": {"operationId": "previewDeleteNotificationSubscription", "summary": "通知渠道删除预检", "parameters": [{"name": "subscription_id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "删除预检影响范围，或删除成功"}, "401": {"description": "未登录"}, "404": {"description": "不存在或无权限"}, "409": {"description": "存在关联实盘、状态不允许、执行中任务或未二次确认"}}}},
    "/admin/market-data/indices": {"get": {"operationId": "listIndices", "responses": {"200": {"description": "主要指数目录及覆盖状态"}}}},
    "/admin/market-data/indices/acquisitions": {"post": {"operationId": "syncIndices", "responses": {"202": {"description": "指数日线同步任务已入队"}, "422": {"description": "无效代码或日期"}}}},
    "/notifications/subscriptions/{subscription_id}/test": {"post": {"operationId": "testNotificationChannel", "responses": {"200": {"description": "脱敏投递状态"}, "404": {"description": "不存在或无权限"}}}},
    "/health": {"get": {"operationId": "health", "responses": {"200": {"description": "healthy"}}}},
    "/auth/initialize": {"post": {"operationId": "initialize", "responses": {"201": {"description": "initialized"}}}},
    "/auth/login": {"post": {"operationId": "login", "responses": {"200": {"description": "logged in"}}}},
    "/auth/logout": {"post": {"operationId": "logout", "responses": {"204": {"description": "logged out"}}}},
    "/auth/me": {"get": {"operationId": "me", "responses": {"200": {"description": "current user"}}}},
    "/auth/accept-invitation": {"post": {"operationId": "acceptInvitation", "responses": {"201": {"description": "accepted"}}}},
    "/factors": {"get": {"operationId": "listFactors", "responses": {"200": {"description": "factor catalog"}}}},
    "/factors/{key}": {"get": {"operationId": "getFactor", "responses": {"200": {"description": "factor detail"}}}},
    "/strategy-library": {"get": {"operationId": "listStrategyLibrary", "responses": {"200": {"description": "策略公共库签名、参数、返回、示例与运行时约束"}}}},
    "/strategies": {"get": {"operationId": "listStrategies", "responses": {"200": {"description": "strategies"}}}, "post": {"operationId": "createStrategy", "responses": {"201": {"description": "created"}}}},
    "/strategies/templates": {"get": {"operationId": "listStrategyTemplates", "responses": {"200": {"description": "templates"}}}},
    "/strategies/{strategy_id}/versions": {"post": {"operationId": "createStrategyVersion", "responses": {"201": {"description": "created"}}}},
    "/strategies/{strategy_id}/run": {"post": {"operationId": "runStrategy", "responses": {"202": {"description": "快速测试已入队"}}}},
    "/strategies/{strategy_id}/runs": {"get": {"operationId": "listStrategyRuns", "responses": {"200": {"description": "策略快速测试记录"}}}},
    "/backtests": {"get": {"operationId": "listBacktests", "responses": {"200": {"description": "回测记录"}}}, "post": {"operationId": "createBacktest", "responses": {"202": {"description": "回测已入队"}}, "description": "允许 name 自定义回测名称（最多160字）；未填写时使用策略、版本和日期区间生成可读名称。"}},
    "/backtests/{run_id}": {"get": {"operationId": "getBacktest", "responses": {"200": {"description": "result"}}}, "patch": {"operationId": "renameBacktest", "description": "本人历史及运行中回测改名；独立元数据不会被 worker 结果写入覆盖。", "parameters": [{"name": "run_id", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name"], "properties": {"name": {"type": "string", "minLength": 1, "maxLength": 160}}}}}}, "responses": {"200": {"description": "id/name"}, "400": {"description": "名称无效"}, "404": {"description": "不存在或非本人"}}}},
    "/backtests/{run_id}/stock-performance": {"get": {"operationId": "getBacktestStockPerformance", "description": "本人已完成回测的股票收益明细，移动平均成本包含费用，按总收益降序、代码稳定排序；未知期末估值排末尾，使用原回测冻结数据。", "parameters": [{"name": "run_id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1}}, {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100}}], "responses": {"200": {"description": "items/total/page/page_size；每股含symbol、quantity、remaining_cost、realized_profit、unrealized_profit、profit、market_value"}, "400": {"description": "分页无效"}, "404": {"description": "不存在或不属于本人"}, "409": {"description": "尚未完成或原快照损坏"}}}},
    "/backtests/compare": {"post": {"operationId": "compareBacktests", "responses": {"200": {"description": "comparison"}}}},
    "/live-instances": {"get": {"operationId": "listLiveInstances", "responses": {"200": {"description": "instances"}}}, "post": {"operationId": "createLiveInstance", "responses": {"201": {"description": "created"}}}},
    "/live-instances/{instance_id}/portfolio": {"get": {"operationId": "getLivePortfolio", "description": "独立加载历史估值与收益曲线，行情读取在短记账事务以外。", "responses": {"200": {"description": "portfolio"}, "404": {"description": "不存在或非本人"}}}},
    "/live-instances/{instance_id}/deliveries": {"get": {"operationId": "getLiveDeliveryPage", "description": "本实例本人通知分页，兼容旧单条信号事件，响应不含通知目标。", "parameters": [{"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1}}, {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100}}], "responses": {"200": {"description": "items/total/page/page_size"}, "400": {"description": "分页无效"}, "404": {"description": "不存在或非本人"}}}},
    "/live-instances/{instance_id}": {"get": {"operationId": "getLiveInstance", "responses": {"200": {"description": "instance"}}, "parameters": [{"name": "view", "in": "query", "schema": {"enum": ["summary"]}, "description": "summary 跳过历史估值与投递扫描，只返回配置、第一页操作及 balances；省略保留原完整响应。"}]}, "delete": {"operationId": "deleteLiveInstance", "summary": "二次确认后删除实盘", "parameters": [{"name": "instance_id", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["confirmed"], "properties": {"confirmed": {"const": true}}}}}}, "responses": {"200": {"description": "删除预检影响范围，或删除成功"}, "401": {"description": "未登录"}, "404": {"description": "不存在或无权限"}, "409": {"description": "存在关联实盘、状态不允许、执行中任务或未二次确认"}}}},
    "/live-instances/{instance_id}/pause": {"post": {"operationId": "pauseLiveInstance", "responses": {"200": {"description": "paused"}}}},
    "/live-instances/{instance_id}/terminate": {"post": {"operationId": "terminateLiveInstance", "responses": {"200": {"description": "terminated"}}}},
    "/live-instances/{instance_id}/analyze/{phase}": {"post": {"operationId": "analyzeLiveInstance", "responses": {"200": {"description": "已执行策略阶段"}}}},
    "/recommendations/{recommendation_id}/{kind}": {"post": {"operationId": "actOnRecommendation", "responses": {"200": {"description": "已处理或幂等重放"}, "400": {"description": "未知动作或 CSRF 无效"}, "401": {"description": "未登录"}, "404": {"description": "资源不存在或不属于当前用户"}, "409": {"description": "建议已处理、键复用、资金不足或持仓不足；本次请求不写入业务状态"}, "422": {"description": "请求字段无效"}, "500": {"description": "服务器异常，事务回滚；可用相同键安全重试"}}, "description": "确认、拒绝或修正建议；用户隔离幂等键，校验候选账本后原子保存状态与审计；重复同一请求返回相同结果。"}},
    "/recommendations/portfolio/{live_instance_id}": {"get": {"operationId": "getPortfolio", "responses": {"200": {"description": "portfolio"}}}},
    "/notifications/subscriptions": {"get": {"operationId": "listSubscriptions", "responses": {"200": {"description": "subscriptions"}}, "parameters": [{"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1}}, {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100}}], "description": "仅本人记录；传分页参数返回 items/total/page/page_size，无参数保留数组兼容。列表不返回通知目标明文或密文。"}, "post": {"operationId": "createSubscription", "responses": {"201": {"description": "created"}}}},
    "/notifications/subscriptions/{subscription_id}": {"patch": {"operationId": "updateSubscription", "responses": {"200": {"description": "updated"}}, "description": "启用和停用渠道均可编辑名称及目标；目标加密保存，校验失败不部分写入，不隐式改变启用状态。"}, "delete": {"operationId": "deleteNotificationSubscription", "summary": "二次确认后删除通知渠道", "parameters": [{"name": "subscription_id", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["confirmed"], "properties": {"confirmed": {"const": true}}}}}}, "responses": {"200": {"description": "删除预检影响范围，或删除成功"}, "401": {"description": "未登录"}, "404": {"description": "不存在或无权限"}, "409": {"description": "存在关联实盘、状态不允许、执行中任务或未二次确认"}}}, "get": {"operationId": "getNotificationSubscription", "description": "仅本人按需读取通知目标，响应 Cache-Control: no-store；加密字段不返回。", "parameters": [{"name": "subscription_id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "本人渠道及通知目标"}, "404": {"description": "不存在或不属于本人"}}}},
    "/notifications/deliveries": {"get": {"operationId": "listDeliveries", "responses": {"200": {"description": "deliveries"}}, "parameters": [{"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1}}, {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100}}], "description": "仅本人记录；传分页参数返回 items/total/page/page_size，无参数保留数组兼容。列表不返回通知目标明文或密文。"}},
    "/admin/market-data/datasets": {"get": {"operationId": "listDatasets", "responses": {"200": {"description": "datasets"}}}},
