[project]
name = "easy-quant-backend"
version = "0.1.0"
description = "Easy Quant 易量化平台后端"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.17",
    "alembic>=1.16",
    "argon2-cffi>=23.1",
    "cryptography>=45.0",
    "flask>=3.1",
    "gunicorn>=23.0",
    "httpx>=0.28",
    "numpy>=2.2",
    "pandas>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[project.scripts]
easy-quant-api = "easy_quant.api.app:main"
easy-quant-worker = "easy_quant.worker.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_quant"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = [".venv"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["contract: 端口契约测试", "api: Flask API 测试", "architecture: 架构边界测试"]
