name: easy-quant
services:
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/chirumori/easy_quant}-backend:${IMAGE_TAG:-master}
    environment: &backend-env
      EASY_QUANT_DATABASE_URL: ${DATABASE_URL:?set external MariaDB DATABASE_URL}
      EASY_QUANT_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      EASY_QUANT_CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      EASY_QUANT_INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      EASY_QUANT_INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      EASY_QUANT_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EASY_QUANT_WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      EASY_QUANT_STRATEGY_TIMEOUT_SECONDS: ${STRATEGY_TIMEOUT_SECONDS:-30}
      EASY_QUANT_STRATEGY_OUTPUT_LIMIT_BYTES: ${STRATEGY_OUTPUT_LIMIT_BYTES:-65536}
      EASY_QUANT_INTRADAY_RUN_TIME: ${INTRADAY_RUN_TIME:-14:50}
      EASY_QUANT_DAILY_DATA_PUBLISH_TIME: ${DAILY_DATA_PUBLISH_TIME:-22:00}
      EASY_QUANT_NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      EASY_QUANT_SMTP_HOST: ${SMTP_HOST:-}
      EASY_QUANT_SMTP_PORT: ${SMTP_PORT:-25}
      EASY_QUANT_SMTP_SENDER: ${SMTP_SENDER:-}
      EASY_QUANT_SMTP_USERNAME: ${SMTP_USERNAME:-}
      EASY_QUANT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "/app/backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    restart: unless-stopped
  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/chirumori/easy_quant}-backend:${IMAGE_TAG:-master}
    command: ["uv", "run", "--project", "backend", "--no-sync", "easy-quant-worker"]
    environment: *backend-env
    depends_on:
      api: {condition: service_healthy}
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/chirumori/easy_quant}-frontend:${IMAGE_TAG:-master}
    ports: ["${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
