name: easy-quant
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: easy_quant
      MARIADB_USER: easy_quant
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: [ "mariadb-data:/var/lib/mysql" ]
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ../backend
    command: [ "uv", "run", "--no-sync", "alembic", "upgrade", "head" ]
    environment: &backend-env
      EASY_QUANT_DATABASE_URL: mysql+pymysql://easy_quant:${DB_PASSWORD}@db:3306/easy_quant
      EASY_QUANT_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      EASY_QUANT_CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      EASY_QUANT_INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      EASY_QUANT_INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      EASY_QUANT_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EASY_QUANT_INTRADAY_POLL_SECONDS: ${INTRADAY_POLL_SECONDS:-60}
      EASY_QUANT_NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      EASY_QUANT_SMTP_HOST: ${SMTP_HOST:-}
      EASY_QUANT_SMTP_PORT: ${SMTP_PORT:-25}
      EASY_QUANT_SMTP_SENDER: ${SMTP_SENDER:-}
      EASY_QUANT_SMTP_USERNAME: ${SMTP_USERNAME:-}
      EASY_QUANT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    build: ../backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')" ]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: ../backend
    command: [ "uv", "run", "--no-sync", "easy-quant-worker" ]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: ../frontend
    ports: [ "${WEB_PORT:-8080}:80" ]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  mariadb-data:
